openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Protected administration operations
  - name: products
    description: Public product catalogue
  - name: storage
    description: Protected image upload helpers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the current admin session
      description: Returns the protected admin session state when the signed admin session cookie is valid.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Authenticated admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Authentication required
        "503":
          description: Admin authentication is not configured
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Start an admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Authenticated admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials
        "503":
          description: Admin authentication is not configured
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End an admin session
      responses:
        "204":
          description: Session ended
  /products:
    get:
      operationId: getPublicProducts
      tags: [products]
      summary: List published products
      responses:
        "200":
          description: Published products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /admin/products:
    get:
      operationId: getAdminProducts
      tags: [admin]
      summary: List products for administration
      security:
        - firebaseBearer: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: stockStatus
          in: query
          schema:
            $ref: "#/components/schemas/StockStatus"
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated, name, displayOrder]
      responses:
        "200":
          description: Admin product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "401":
          description: Authentication required
  /admin/products/{id}:
    get:
      operationId: getAdminProduct
      tags: [admin]
      summary: Get one product for administration
      security:
        - firebaseBearer: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
        "404":
          description: Product not found
    put:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      security:
        - firebaseBearer: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "401":
          description: Authentication required
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a product
      security:
        - firebaseBearer: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product deleted
        "401":
          description: Authentication required
        "404":
          description: Product not found
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get real dashboard product totals
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Product summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          description: Authentication required
  /projects:
    get:
      operationId: getPublicProjects
      tags: [projects]
      summary: List published projects
      responses:
        "200":
          description: Published projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /admin/projects:
    get:
      operationId: getAdminProjects
      tags: [projects]
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Project catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /admin/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    put:
      operationId: updateProject
      tags: [projects]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      security:
        - firebaseBearer: []
      responses:
        "204":
          description: Project removed from the catalogue
  /storage/uploads/request-url:
    post:
      operationId: requestProductImageUploadUrl
      tags: [storage]
      summary: Request a presigned product image upload URL
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Presigned upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid upload request
        "401":
          description: Authentication required
  /machines:
    get:
      operationId: getPublicMachines
      tags: [machines]
      summary: List published machines
      responses:
        "200":
          description: Published machines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Machine"
  /admin/machines:
    get:
      operationId: getAdminMachines
      tags: [machines]
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Machine catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Machine"
    post:
      operationId: createMachine
      tags: [machines]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineInput"
      responses:
        "201":
          description: Machine created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
  /admin/machines/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    put:
      operationId: updateMachine
      tags: [machines]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineInput"
      responses:
        "200":
          description: Machine updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
    delete:
      operationId: deleteMachine
      tags: [machines]
      security:
        - firebaseBearer: []
      responses:
        "204":
          description: Machine deleted
  /services:
    get:
      operationId: getPublicServices
      tags: [services]
      summary: List published services
      responses:
        "200":
          description: Published services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /admin/services:
    get:
      operationId: getAdminServices
      tags: [services]
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Service catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /admin/services/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    put:
      operationId: updateService
      tags: [services]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      security:
        - firebaseBearer: []
      responses:
        "204":
          description: Service deleted
  /website-content:
    get:
      operationId: getWebsiteContent
      tags: [content]
      responses:
        "200":
          description: Public website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteContent"
  /admin/website-content:
    get:
      operationId: getAdminWebsiteContent
      tags: [content]
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteContent"
    put:
      operationId: updateWebsiteContent
      tags: [content]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteContentInput"
      responses:
        "200":
          description: Website content updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteContent"
  /settings:
    get:
      operationId: getPublicSettings
      tags: [settings]
      responses:
        "200":
          description: Public website settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteSettings"
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [settings]
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Website settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteSettingsInput"
      responses:
        "200":
          description: Website settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteSettings"
  /contact-numbers:
    get:
      operationId: getPublicContactNumbers
      tags: [settings]
      responses:
        "200":
          description: Public contact numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactNumber"
  /admin/contact-numbers:
    get:
      operationId: getAdminContactNumbers
      tags: [settings]
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Contact numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactNumber"
    post:
      operationId: createContactNumber
      tags: [settings]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactNumberInput"
      responses:
        "201":
          description: Contact number created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactNumber"
  /admin/contact-numbers/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    put:
      operationId: updateContactNumber
      tags: [settings]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactNumberInput"
      responses:
        "200":
          description: Contact number updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactNumber"
    delete:
      operationId: deleteContactNumber
      tags: [settings]
      security:
        - firebaseBearer: []
      responses:
        "204":
          description: Contact number deleted
  /admin/requests/quotes:
    get:
      operationId: getAdminQuoteRequests
      tags: [requests]
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Recent quote requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteRequest"
  /admin/requests/contacts:
    get:
      operationId: getAdminContactRequests
      tags: [requests]
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Recent contact requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactRequest"
  /admin/requests/{collection}/{id}/status:
    parameters:
      - name: collection
        in: path
        required: true
        schema:
          type: string
          enum: [quotes, contacts]
      - $ref: "#/components/parameters/ProductId"
    patch:
      operationId: updateRequestStatus
      tags: [requests]
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestStatusInput"
      responses:
        "200":
          description: Request status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                required: [id, status]
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: FirebaseIDToken
  schemas:
    AdminLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminSession:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    ProductStatus:
      type: string
      enum: [draft, published, archived]
    StockStatus:
      type: string
      enum: [in_stock, low_stock, out_of_stock]
    ProductInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        shortDescription:
          type: string
          minLength: 1
          maxLength: 320
        fullDescription:
          type: string
          maxLength: 5000
        imagePath:
          type: [string, "null"]
          maxLength: 500
        imageAlt:
          type: [string, "null"]
          maxLength: 180
        category:
          type: string
          minLength: 1
          maxLength: 100
        price:
          type: [number, "null"]
          minimum: 0
        status:
          $ref: "#/components/schemas/ProductStatus"
        stockStatus:
          $ref: "#/components/schemas/StockStatus"
        displayOrder:
          type: integer
          minimum: 0
      required: [name, shortDescription, fullDescription, category, status, stockStatus]
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          properties:
            id:
              type: string
              minLength: 1
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required: [id, createdAt, updatedAt]
    AdminSummary:
      type: object
      properties:
        totalProducts:
          type: integer
        publishedProducts:
          type: integer
        draftProducts:
          type: integer
        archivedProducts:
          type: integer
        categories:
          type: integer
        totalMachines:
          type: integer
        totalServices:
          type: integer
        totalProjects:
          type: integer
        totalRequests:
          type: integer
      required: [totalProducts, publishedProducts, draftProducts, archivedProducts, categories]
    UploadRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        folder:
          type: string
          enum: [products, machines, services, projects, requests]
      required: [name, size, contentType]
    UploadResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
      required: [uploadURL, objectPath]
    MachineInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        slug: { type: string, minLength: 1, maxLength: 180 }
        category: { type: string, maxLength: 180 }
        shortDescription: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 5000 }
        fullDescription: { type: string, maxLength: 10000 }
        specifications: { type: array, items: { type: string, maxLength: 240 } }
        features: { type: array, items: { type: string, maxLength: 240 } }
        applications: { type: array, items: { type: string, maxLength: 180 } }
        imageUrl: { type: [string, "null"], maxLength: 500 }
        imageAlt: { type: [string, "null"], maxLength: 180 }
        images: { type: array, items: { type: string, maxLength: 500 } }
        relatedServices: { type: array, items: { type: string, maxLength: 180 } }
        displayOrder: { type: integer, minimum: 0 }
        published: { type: boolean }
      required: [name, slug, description]
    Machine:
      allOf:
        - $ref: "#/components/schemas/MachineInput"
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
          required: [id]
    ServiceInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        slug: { type: string, minLength: 1, maxLength: 180 }
        category: { type: string, maxLength: 180 }
        shortDescription: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 5000 }
        fullDescription: { type: string, maxLength: 10000 }
        content: { type: string, maxLength: 10000 }
        features: { type: array, items: { type: string, maxLength: 240 } }
        images: { type: array, items: { type: string, maxLength: 500 } }
        imageAlt: { type: [string, "null"], maxLength: 180 }
        offerings: { type: array, items: { type: string, maxLength: 180 } }
        applications: { type: array, items: { type: string, maxLength: 180 } }
        materials: { type: array, items: { type: string, maxLength: 180 } }
        whyChoose: { type: array, items: { type: string, maxLength: 240 } }
        relatedSlugs: { type: array, items: { type: string, maxLength: 180 } }
        displayOrder: { type: integer, minimum: 0 }
        status: { type: string, enum: [draft, published, archived] }
        featured: { type: boolean }
      required: [title, slug, description]
    Service:
      allOf:
        - $ref: "#/components/schemas/ServiceInput"
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
          required: [id]
    ProjectInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        shortDescription: { type: string, maxLength: 500 }
        fullDescription: { type: string, maxLength: 10000 }
        imagePath: { type: [string, "null"], maxLength: 500 }
        additionalImages: { type: array, items: { type: string, maxLength: 500 }, maxItems: 30 }
        videoUrl: { type: string, maxLength: 500 }
        published: { type: boolean }
        featured: { type: boolean }
        displayOrder: { type: integer, minimum: 0 }
      required: [name, shortDescription, fullDescription]
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
          required: [id]
    WebsiteContentInput:
      type: object
      additionalProperties: false
      properties:
        heroHeading: { type: string, maxLength: 240 }
        heroDescription: { type: string, maxLength: 1000 }
        heroImage: { type: [string, "null"], maxLength: 500 }
        heroCtaText: { type: string, maxLength: 120 }
        aboutTitle: { type: string, maxLength: 240 }
        aboutBody: { type: string, maxLength: 4000 }
        qualityBody: { type: string, maxLength: 4000 }
        trustBody: { type: string, maxLength: 4000 }
        processBody: { type: string, maxLength: 4000 }
        graphicsDesignBody: { type: string, maxLength: 4000 }
        signageBody: { type: string, maxLength: 4000 }
        contactBody: { type: string, maxLength: 4000 }
        footerBody: { type: string, maxLength: 4000 }
        metadataTitle: { type: string, maxLength: 240 }
        metadataDescription: { type: string, maxLength: 320 }
    WebsiteContent:
      allOf:
        - $ref: "#/components/schemas/WebsiteContentInput"
        - type: object
          properties:
            id: { type: string }
    WebsiteSettingsInput:
      type: object
      properties:
        businessName: { type: string, minLength: 1, maxLength: 180 }
        email: { type: string, maxLength: 180 }
        address: { type: string, maxLength: 1000 }
        whatsappNumbers: { type: array, items: { type: string, maxLength: 40 } }
        socialLinks:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              url: { type: string, format: uri }
            required: [label, url]
        googleMapsUrl: { type: string, maxLength: 500 }
        footerInformation: { type: string, maxLength: 2000 }
        logoPath: { type: [string, "null"], maxLength: 500 }
        faviconPath: { type: [string, "null"], maxLength: 500 }
        metadataTitle: { type: string, maxLength: 240 }
        metadataDescription: { type: string, maxLength: 320 }
      required: [businessName, email, address, whatsappNumbers, socialLinks, googleMapsUrl, footerInformation, metadataTitle, metadataDescription]
    WebsiteSettings:
      allOf:
        - $ref: "#/components/schemas/WebsiteSettingsInput"
        - type: object
          properties:
            id: { type: string }
    ContactNumberInput:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, minLength: 5, maxLength: 40 }
        showOnWebsite: { type: boolean }
        useForCalls: { type: boolean }
        useForWhatsApp: { type: boolean }
        isPrimary: { type: boolean }
        displayOrder: { type: integer, minimum: 0 }
      required: [label, phone]
    ContactNumber:
      allOf:
        - $ref: "#/components/schemas/ContactNumberInput"
        - type: object
          properties:
            id: { type: string }
          required: [id]
    QuoteRequest:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        service: { type: string }
        requirementDetails: { type: string }
        quantity: { type: string }
        preferredDate: { type: string }
        attachmentUrl: { type: [string, "null"] }
        attachmentName: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, phone, service, requirementDetails, status]
    ContactRequest:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        message: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, phone, message, status]
    RequestStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [new, contacted, quoted, approved, completed, cancelled]
      required: [status]

