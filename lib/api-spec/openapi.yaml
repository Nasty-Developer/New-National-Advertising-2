openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Protected administration operations
  - name: products
    description: Public product catalogue
  - name: storage
    description: Protected image upload helpers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the current admin session
      description: Returns the protected admin session state when the signed admin session cookie is valid.
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: Authenticated admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Authentication required
        "503":
          description: Admin authentication is not configured
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Start an admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Authenticated admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials
        "503":
          description: Admin authentication is not configured
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End an admin session
      responses:
        "204":
          description: Session ended
  /products:
    get:
      operationId: getPublicProducts
      tags: [products]
      summary: List published products
      responses:
        "200":
          description: Published products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /admin/products:
    get:
      operationId: getAdminProducts
      tags: [admin]
      summary: List products for administration
      security:
        - adminSessionCookie: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: stockStatus
          in: query
          schema:
            $ref: "#/components/schemas/StockStatus"
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated, name, displayOrder]
      responses:
        "200":
          description: Admin product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "401":
          description: Authentication required
  /admin/products/{id}:
    get:
      operationId: getAdminProduct
      tags: [admin]
      summary: Get one product for administration
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
        "404":
          description: Product not found
    put:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "401":
          description: Authentication required
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a product
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product deleted
        "401":
          description: Authentication required
        "404":
          description: Product not found
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get real dashboard product totals
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: Product summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          description: Authentication required
  /storage/uploads/request-url:
    post:
      operationId: requestProductImageUploadUrl
      tags: [storage]
      summary: Request a presigned product image upload URL
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Presigned upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid upload request
        "401":
          description: Authentication required
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
  securitySchemes:
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: admin_session
  schemas:
    AdminLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminSession:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    ProductStatus:
      type: string
      enum: [draft, published, inactive]
    StockStatus:
      type: string
      enum: [in_stock, low_stock, out_of_stock]
    ProductInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        shortDescription:
          type: string
          minLength: 1
          maxLength: 320
        fullDescription:
          type: string
          maxLength: 5000
        imagePath:
          type: [string, "null"]
          maxLength: 500
        imageAlt:
          type: [string, "null"]
          maxLength: 180
        category:
          type: string
          minLength: 1
          maxLength: 100
        price:
          type: [number, "null"]
          minimum: 0
        status:
          $ref: "#/components/schemas/ProductStatus"
        stockStatus:
          $ref: "#/components/schemas/StockStatus"
        displayOrder:
          type: integer
          minimum: 0
      required: [name, shortDescription, fullDescription, category, status, stockStatus]
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          properties:
            id:
              type: integer
              format: int32
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required: [id, createdAt, updatedAt]
    AdminSummary:
      type: object
      properties:
        totalProducts:
          type: integer
        publishedProducts:
          type: integer
        draftProducts:
          type: integer
        inactiveProducts:
          type: integer
        categories:
          type: integer
      required: [totalProducts, publishedProducts, draftProducts, inactiveProducts, categories]
    UploadRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required: [name, size, contentType]
    UploadResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
      required: [uploadURL, objectPath]

